openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: API управления уведомлениями и историей их доставки
servers:
- url: http://localhost:8085
tags:
- name: Notifications
  description: Работа с уведомлениями
paths:
  /api/v1/patients/{patientId}/notifications:
    get:
      tags:
      - Notifications
      summary: Получить историю уведомлений пациента
      operationId: getPatientNotifications
      parameters:
      - name: patientId
        in: path
        required: true
        description: Уникальный идентификатор пациента
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: История уведомлений получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/notifications/{notificationId}:
    get:
      tags:
      - Notifications
      summary: Получить сведения об уведомлении
      operationId: getNotification
      parameters:
      - name: notificationId
        in: path
        required: true
        description: Уникальный идентификатор уведомления
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Уведомление найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/notifications/{notificationId}/retry:
    post:
      tags:
      - Notifications
      summary: Повторить отправку уведомления
      operationId: retryNotification
      parameters:
      - name: notificationId
        in: path
        required: true
        description: Уникальный идентификатор уведомления
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: Повторная отправка инициирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Notification:
      type: object
      required:
      - notificationId
      - scheduleEntryId
      - patientId
      - scheduledAt
      - plannedSendAt
      - status
      - createdAt
      - sentAt
      properties:
        notificationId:
          type: integer
          format: int64
          minimum: 1
        scheduleEntryId:
          type: integer
          format: int64
          minimum: 1
        patientId:
          type: integer
          format: int64
          minimum: 1
        scheduledAt:
          type: string
          format: date-time
        plannedSendAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - scheduled
          - sent
          - failed
          - cancelled
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
    NotificationPage:
      type: object
      required:
      - items
      - page
      - size
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
    Error:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Пользователь не аутентифицирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Уведомление не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Повторная отправка невозможна для текущего статуса уведомления
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
